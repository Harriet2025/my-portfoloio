# Runs the whole portfolio: Next.js frontend (public) + Python API (private).
# Works with Coolify's "Docker Compose" build pack. Only the frontend needs a domain.
services:
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:3000}
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATA_DIR: /data
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      NOTIFY_EMAIL_TO: ${NOTIFY_EMAIL_TO:-}
    volumes:
      - portfolio-data:/data
    restart: unless-stopped

volumes:
  portfolio-data:
