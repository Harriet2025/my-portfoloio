  return href

const CV_FILE = 'Harriet_Ayim_CV.pdf';
function CvLink({ className = '', compact = false }) {
  /* On a normal host this is a plain download link. Inside the Claude viewer, downloads go through the downloads capability. */
  const onClick = async (e) => {
    if (!(window.claude && window.claude.use)) return;
    e.preventDefault();
    try {
      const dl = await window.claude.use('downloads');
      if (!dl) { window.open(CV_FILE, '_blank'); return; }
      const blob = await (await fetch(CV_FILE)).blob();
      await dl.save({ filename: 'Harriet_Ayim_CV.pdf', data: blob });
    } catch (err) {
      if (!(err && err.code === 'declined')) window.open(CV_FILE, '_blank');
    }
  };
  return (
    <a href={CV_FILE} onClick={onClick} download="Harriet_Ayim_CV.pdf" target="_blank" rel="noopener noreferrer"
      className={`inline-flex items-center justify-center gap-2 rounded-full border border-line bg-sand font-semibold text-char transition duration-200 hover:border-terra hover:bg-terra hover:text-white hover:shadow-lg hover:shadow-terra/20 ${compact ? 'px-5 py-2.5 text-[15px]' : 'px-6 py-3 text-[15px]'} ${className}`}>
      <Icon n="download" size={18} />Download CV
    </a>
  );
}

const staggerParent = { hidden: {}, show: { transition: { staggerChildren: 0.1, delayChildren: 0.05 } } };

const VIEW = { once: true, amount: 0.1 };
function Stagger({ as = 'div', children, ...p }) {
  const C = motion[as];
  return <C variants={staggerParent} initial="hidden" whileInView="show" viewport={VIEW} {...p}>{children}</C>;
}
function Item({ as = 'div', children, ...p }) {
  const C = motion[as];
  return <C variants={staggerChild} {...p}>{children}</C>;
}

function Simulator({ kind = 'job' }) {
  const sim = SIMS[kind];
  const [stage, setStage] = useState(0);   /* 0 idle, 1-3 step running, 4 finished */
  const timers = useRef([]);
  useEffect(() => () => timers.current.forEach(clearTimeout), []);
  const run = () => {
    timers.current.forEach(clearTimeout); timers.current = [];
    setStage(1);
    [2, 3, 4].forEach((s, n) => timers.current.push(setTimeout(() => setStage(s), 900 * (n + 1))));
  };
  const running = stage > 0 && stage < 4;
  return (
    <div className="rounded-2xl border border-line bg-cream p-4 sm:p-5">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <div>
          <Eyebrow>Micro-demo</Eyebrow>
          <p className="mt-1 font-display text-lg font-semibold">Test Automation</p>
        </div>
        <button type="button" onClick={run} disabled={running}
          className="inline-flex items-center gap-2 rounded-full bg-terra px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-terrad disabled:opacity-60">
          <Icon n="play" size={14} fill="currentColor" />{running ? 'Running…' : stage === 4 ? 'Run Again' : 'Run Test'}
        </button>
      </div>

      <ol className="mt-4 grid gap-2">
        {sim.steps.map((st, i) => {
          const done = stage === 4 || i + 1 < stage;
          const active = i + 1 === stage && stage < 4;
          return (
            <li key={st.label} className={`flex items-center gap-3 rounded-xl border px-3 py-2.5 transition-colors ${done ? 'border-terra/50 bg-white' : active ? 'border-terra bg-white' : 'border-line bg-white/60'}`}>
              <span className={`grid h-8 w-8 shrink-0 place-items-center rounded-full border transition-colors ${done ? 'border-terra bg-terra text-white' : active ? 'border-terra text-terra' : 'border-line text-slate'}`}>
                {done ? <Icon n="check2" size={16} /> : active ? <span className="h-4 w-4 animate-spin rounded-full border-2 border-terra border-t-transparent" /> : <Icon n={st.icon} size={16} />}
              </span>
              <div className="min-w-0 flex-1">
                <p className="text-sm font-semibold leading-tight">{st.label}</p>

    ['tiktok', 'TikTok', `@${PROFILE.tiktok}`, URLS.tiktok],
  ];
  const card = `flex items-center gap-4 rounded-2xl border border-line px-4 py-3.5 ${GLASS}`;
  return (
    <section id="contact" className="relative scroll-mt-24 overflow-hidden bg-sand">
      <Glow className="-left-20 top-10 h-80 w-80" />
      <Glow className="-right-24 bottom-20 h-80 w-80 !bg-terra/15" />
      <Stagger className="relative mx-auto grid w-full max-w-[1180px] gap-12 px-4 py-16 sm:px-8 sm:py-24 lg:grid-cols-[1.2fr_1fr] lg:gap-16">
        <Item className="min-w-0">
          <div className="flex items-center gap-2"><Dot /><Eyebrow className="!text-saged">Open to new projects</Eyebrow></div>
          <h2 className="mt-4 font-display text-[clamp(2.4rem,6vw,4.6rem)] font-extrabold leading-[.98] tracking-tight [text-wrap:balance]">Have a <span className="text-terra">project</span> in mind?</h2>
          <p className="mt-5 max-w-[50ch] text-lg leading-relaxed text-char">I'm always open to discussing new web projects, software development, and workflow automation opportunities.</p>
          <div className="mt-8"><Btn href={URLS.email} variant="primary" icon="mail">Get In Touch</Btn></div>
        </Item>
        <Stagger as="ul" className="grid min-w-0 gap-3 self-start">
          {links.map(([ic, label, text, href]) => (
            <Item as="li" key={label}>
              <a href={href} target="_blank" rel="noreferrer" className={`group ${card} ${LIFT}`}>
                <IconTile n={ic} />
                <span className="min-w-0 flex-1"><span className="block font-mono text-xs uppercase tracking-[.14em] text-slate">{label}</span><span className="block truncate text-[15px] font-semibold">{text}</span></span>
                <Icon n="up" size={16} className="shrink-0 text-terra transition group-hover:translate-x-0.5" />
              </a>
            </Item>
          ))}
          <Item as="li" className={card}>
            <IconTile n="mail" />
            <span className="min-w-0 flex-1"><span className="block font-mono text-xs uppercase tracking-[.14em] text-slate">Email</span><span className="block select-all truncate text-[15px] font-semibold">{PROFILE.email}</span></span>
            <button type="button" onClick={copy} className="inline-flex shrink-0 items-center gap-1.5 rounded-md border border-line bg-cream px-2.5 py-1 font-mono text-xs transition hover:border-terra"><Icon n="copy" size={13} />{copied ? 'Copied' : 'Copy'}</button>
          </Item>
          <Item as="li" className={card}>
            <IconTile n="globe" />
            <span className="min-w-0 flex-1"><span className="block font-mono text-xs uppercase tracking-[.14em] text-slate">Location</span><span className="block text-[15px] font-semibold">Accra, Ghana</span></span>
          </Item>
        </Stagger>
      </Stagger>
      <div className="relative mx-auto w-full max-w-[1180px] px-4 pb-10 sm:px-8"><p className="border-t border-line pt-6 font-mono text-xs text-slate">© 2026 Harriet Ama-Adubea Ayim · Built with practical solutions in mind.</p></div>
    </section>
  );
}

/* ====================== App ====================== */
function App() {
  const [active, setActive] = useState('home');
  const [open, setOpen] = useState(null);
  const [toast, setToast] = useState('');
  const close = useCallback(() => setOpen(null), []);

  useEffect(() => {
    const ids = NAV.map(([id]) => id);
    const onScroll = () => {
      let cur = 'home';
      for (const id of ids) {
        const el = document.getElementById(id);
        if (el && el.getBoundingClientRect().top <= 140) cur = id;
      }
      setActive(cur);
    };
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  const cv = () => {
    if (RESUME_URL) { window.open(RESUME_URL, '_blank'); return; }
    setToast('CV link is not connected yet.');
    setTimeout(() => setToast(''), 2400);
  };
  const project = PROJECTS.find((p) => p.id === open);

  return (
    <MotionConfig reducedMotion="user">
      <Header active={active} />
      <main>
        <Hero onCv={cv} />
        <About />
        <Services />
        <TechStack />
        <Skills />
        <Projects onOpen={setOpen} />
        <Testimonials />
      </main>
      <Contact />
      <AnimatePresence>{project && <Drawer key={project.id} project={project} onClose={close} />}</AnimatePresence>
      <AnimatePresence>
        {toast && (
          <motion.div initial={{ opacity: 0, y: 12 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, y: 12 }} role="status"
            className="fixed bottom-6 left-1/2 z-50 -translate-x-1/2 rounded-full bg-char px-5 py-3 text-sm font-semibold text-cream shadow-lg">{toast}</motion.div>
        )}
      </AnimatePresence>
    </MotionConfig>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
